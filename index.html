<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proximo Destino.com</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/body.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <!-- ===== SEBASTIAN ===== -->
  <header id="header" class="hero-section d-flex flex-column align-items-center text-center text-white position-relative" style="background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(255, 255, 255, 0.45)), url('/Hackaton_1_Generation/img/Banner-Viajes.jpg') no-repeat center center/cover; min-height: 100vh;">
    <nav class="navbar navbar-expand-lg shadow-sm fixed-top" data-bs-theme="dark">
      <div class="container-fluid">
        <div class="d-flex flex-column">
          <a href="#" class="text-decoration-none text-white"><h1 class="display-5 fw-bold">PróximoDestino.com</h1></a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
          <div class="collapse navbar-collapse text-center" id="navbarNav">
              <ul class="navbar-nav mx-auto text-center">
                <li class="nav-item">
                  <a class="nav-link active" href="#">Inicio</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Paquetes Viajes</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Nosotros</a>
                </li>
              </ul>
              <div class="d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0 align-items-center">
                <button type="button" class="login btn btn-outline-secondary m-1 fw-bold" id="login">Login</button>
                <button type="button" class="registro btn btn-primary m-1 fw-bold" id="registro">Registro</button>
              </div>
              <div class="d-flex flex-column flex-lg-row mt-3 mt-lg-0 mx-5 align-items-center">
                <button type="button" class="carroc btn btn-outline-secondary border-3"><i class="bi bi-cart fw-bold"></i></button>
              </div>
            </div>
          </div>
        </nav>
<div class="container" style="padding-top: 25vh;">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <h1 class="display-3 fw-bold mb-3">Viajar es la única cosa que compras y te hace más rico.</h1>
                    <div class="d-sm-flex justify-content-sm-center gap-3" style="padding-top: 10%;">
                        <a href="#" class="btnViajes btn btn-secondary btn-lg px-4 fw-bold text-white mb-2 mb-sm-0 shadow">Ver Paquetes Viajes</a>
                        <a href="#" class="btnViajes btn btn-secondary btn-lg px-4 fw-bold text-white mb-2 mb-sm-0 shadow">Contactanos</a>
                    </div>
                </div>                        
            </div>            
  </header>
  <!-- ===== CESAR ===== -->
  <main id="main"></main>
  <!-- ===== JUAN CARLOS ===== -->
  <div id="modal" class="modal hidden"></div>
  <!-- ===== JUAN SEBASTIAN ===== -->
  <div id="cart" class="cart hidden"></div>
  <!-- ===== THOMAS ===== -->
  <footer id="footer"></footer>
  <script src="js/packages.js"></script>
  <script src="js/header.js"></script>
  <script src="js/body.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
